name: Scheduled  scrape
on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch:
  jobs:
    trigger:
      runs-on: ubuntu-latest
      steps:
        - name: Trigger scrape endpoint
          run: |
            curl --fail --max-time 180 --retry 2 --retry-delay 20 -X POST \
            "${{ secrets.API_BASE_URL }}/api/admin/cron/scrape" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"